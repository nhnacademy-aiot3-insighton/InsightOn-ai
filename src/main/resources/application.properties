spring.application.name=insighton-ai

management.endpoints.web.exposure.include=health,prometheus

# ===============================
# 서비스 간 호출
# ===============================
core-service.url=http://insighton-core

# ===============================
# PostgreSql (dev/prod 공통 인스턴스, 값만 env로 주입)
# ===============================
spring.datasource.url=jdbc:postgresql://s3.java21.net:8000/aiot3-team3-project?currentSchema=ai
spring.datasource.username=aiot3-team3
spring.datasource.password=${DB_PASSWORD}

# ===============================
# Spring AI - Gemini
# ===============================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash

# ===============================
# RabbitMQ
# ===============================
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

