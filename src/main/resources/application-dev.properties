# dev 프로파일에서만 다른 설정. 공통 설정은 application.properties 참고.
# Redis/RabbitMQ/InfluxDB는 로컬에 직접 띄운 걸 사용 (prod의 공유 인프라와 다름).

spring.config.import=classpath:config/dev/db.properties, classpath:config/dev/zipkin.properties

server.port=8084

# core를 로컬에 안 띄우는 경우, 실제로 호출하지만 않으면 이 값은 상관없음
# (Feign이 고정 url을 쓰면 빈 생성 시점엔 연결을 안 하고, 실제 호출 시점에만 실패함)
core-service.url=http://localhost:8081

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ===============================
# Redis (로컬)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# RabbitMQ (로컬)
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

