# ===============================
# PostgreSql
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:8000/aiot3-team3-project?currentSchema=ai
spring.datasource.username=aiot3-team3
spring.datasource.password=${DB_PASSWORD}

spring.datasource.type=org.apache.commons.dbcp2.BasicDataSource

spring.datasource.dbcp2.min-idle=20
spring.datasource.dbcp2.max-idle=20
spring.datasource.dbcp2.max-total=20
spring.datasource.dbcp2.initial-size=20

spring.datasource.dbcp2.test-on-borrow=true
spring.datasource.dbcp2.validation-query=select 1;

spring.datasource.dbcp2.remove-abandoned-on-borrow=true

# ===============================
# InfluxDB
# ===============================
influxdb.url=http://insighton-influxdb:8086
influxdb.org=insighton
influxdb.bucket=insighton-bucket
influxdb.token=${INFLUXDB_TOKEN}